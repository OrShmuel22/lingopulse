[project]
name = "lingopulse"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lingopulse"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run real model inference (deselect with '-m not slow')",
]
